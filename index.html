function hx(s){var a=new Uint8Array(s.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(s.substr(i*2,2),16);return a;}
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function toHex(a){var h='';for(var i=0;i<a.length;i++)h+=a[i].toString(16).padStart(2,'0');return h;}
function importRaw(raw){return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['decrypt']);}
async function derive(pw){var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:hx(SALT),iterations:ITER,hash:'SHA-256'},km,256);
  return importRaw(new Uint8Array(bits));}
async function openPage(key){var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:hx(IV)},key,b64(CT));
  var txt=new TextDecoder().decode(pt);document.open();document.write(txt);document.close();}
async function boot(){
  var kk=null;try{kk=localStorage.getItem('sitekey');}catch(e){}
  if(kk){try{await openPage(await importRaw(hx(kk)));return;}catch(e){try{localStorage.removeItem('sitekey');}catch(_){}}}
  document.getElementById('lk').style.display='flex';
  var pw=document.getElementById('pw'),go=document.getElementById('go'),er=document.getElementById('er');
  async function attempt(){er.textContent='';go.disabled=true;go.textContent='解锁中…';
    try{var key=await derive(pw.value||'');
      try{var raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));
        if(document.getElementById('rm').checked)localStorage.setItem('sitekey',toHex(raw));}catch(e){}
      await openPage(key);}
    catch(e){go.disabled=false;go.textContent='解锁';er.textContent='密码不对，再试试';
      try{localStorage.removeItem('sitekey');}catch(_){}}}
  go.addEventListener('click',attempt);
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')attempt();});
  pw.focus();}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){boot();});}
