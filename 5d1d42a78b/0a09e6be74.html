function importRaw(raw){return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['decrypt']);}
async function derive(pw){var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
